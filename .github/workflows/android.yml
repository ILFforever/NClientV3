name: Android CI

on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout sources
                uses: actions/checkout@v7

            -   name: set up JDK 17
                uses: actions/setup-java@v5.6.0
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Add empty keystore.properties
                run: |
                    echo "storePassword=dummy" > keystore.properties
                    echo "keyPassword=dummy" >> keystore.properties
                    echo "keyAlias=dummy" >> keystore.properties
                    echo "storeFile=dummy.jks" >> keystore.properties

            -   name: Run unit tests
                run: ./gradlew testPost28DebugUnitTest

            -   name: Upload test report
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: Unit test report
                    path: app/build/reports/tests/
                    retention-days: 30

            -   name: Assemble Debug with Gradle
                run: ./gradlew assembleDebug

            -   name: Bundle Debug with Gradle
                run: ./gradlew bundleDebug

            -   name: Upload Artifact
                uses: actions/upload-artifact@v7
                with:
                    name: Debug APKs
                    path: app/build/outputs/apk/
                    retention-days: 30

            # Reported, not enforced: lint currently has a backlog of pre-existing errors, so
            # abortOnError stays off until they are triaged. Publishing the report at least makes
            # the trend visible on every PR instead of only when someone runs lint by hand.
            -   name: Lint
                if: always()
                run: ./gradlew lintPost28Debug

            -   name: Upload lint report
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: Lint report
                    path: app/build/reports/lint-results-post28Debug.html
                    retention-days: 30
